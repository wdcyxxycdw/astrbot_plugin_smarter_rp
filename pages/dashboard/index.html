<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smarter RP 控制台</title>
    <script>
      window.__smarterRpBootError = function (error) {
        var root = document.getElementById('root');
        if (!root) return;
        var message = error && (error.stack || error.message) ? (error.stack || error.message) : String(error);
        root.innerHTML = '<div class="boot-error"><strong>Smarter RP WebUI 加载失败。</strong><pre>' + message + '</pre></div>';
      };
      window.addEventListener('error', function (event) {
        window.__smarterRpBootError(event.error || event.message || '脚本加载失败。');
      });
      window.addEventListener('unhandledrejection', function (event) {
        window.__smarterRpBootError(event.reason || '未处理的 Promise 异常。');
      });
    </script>
    <script type="module" crossorigin src="./assets/index-CsIXTsN-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cg_7bmN4.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <strong>Smarter RP</strong>
        <span>正在加载 WebUI...</span>
      </div>
    </div>
  </body>
</html>
