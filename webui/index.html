<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smarter RP WebUI</title>
    <script>
      window.__smarterRpBootError = function (error) {
        var root = document.getElementById('root');
        if (!root) return;
        var message = error && (error.stack || error.message) ? (error.stack || error.message) : String(error);
        root.innerHTML = '<div class="boot-error"><strong>Smarter RP WebUI failed to load.</strong><pre>' + message + '</pre></div>';
      };
      window.addEventListener('error', function (event) {
        window.__smarterRpBootError(event.error || event.message || 'Script failed to load.');
      });
      window.addEventListener('unhandledrejection', function (event) {
        window.__smarterRpBootError(event.reason || 'Unhandled promise rejection.');
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <strong>Smarter RP</strong>
        <span>Loading WebUI...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
